
name: Dashboard Sync V3

on:
  workflow_dispatch:
  push:
    paths:
      - "dashboard/dashboard.json"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Verify repository
        run: |
          echo "===== DASHBOARD SYNC V3 ====="
          pwd
          ls -la
          ls -la dashboard

          if [ ! -f dashboard/dashboard.json ]; then
            echo "ERROR: dashboard/dashboard.json not found"
            exit 1
          fi

      - name: Send to Google Apps Script
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          RESPONSE=$(jq -n \
            --arg file "dashboard.json" \
            --arg content "$(cat dashboard/dashboard.json)" \
            '{file:$file,content:$content}' \
            | curl -s \
                -X POST \
                -H "Content-Type: application/json" \
                -d @- \
                "$GAS_URL")

          echo "Apps Script response: $RESPONSE"

          if [ "$RESPONSE" != "OK" ]; then
            echo "Dashboard sync failed."
            exit 1
          fi

          echo "Dashboard sync completed."
