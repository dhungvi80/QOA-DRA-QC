
name: Weekly Review

on:
  schedule:
    - cron: "0 11 * * FRI"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Weekly report
        run: |
          mkdir -p reports
          echo "# Weekly Review" > reports/weekly-$(date +%F).md
          echo "Generated at $(date)" >> reports/weekly-$(date +%F).md

      - name: Commit report
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add reports

          git commit -m "Weekly Review" || exit 0

          git push
