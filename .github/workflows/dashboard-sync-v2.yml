
name: Dashboard Sync V2

on:
  workflow_dispatch:
  push:
    paths:
      - "dashboard.json"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Verify repository
        run: |
          echo "=== WORKFLOW VERSION V2 ==="
          pwd
          ls -la

          if [ ! -f dashboard.json ]; then
            echo "dashboard.json not found."
            exit 1
          fi

      - name: Send to Google Apps Script
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          RESPONSE=$(jq -n \
            --arg file "dashboard.json" \
            --arg content "$(cat dashboard.json)" \
            '{file:$file,content:$content}' \
            | curl -s \
                -X POST \
                -H "Content-Type: application/json" \
                -d @- \
                "$GAS_URL")

          echo "Response: $RESPONSE"

          if [ "$RESPONSE" != "OK" ]; then
            exit 1
          fi
