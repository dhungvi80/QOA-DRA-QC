name: Dashboard Sync

on:
  push:
    paths:
      - "dashboard/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Send dashboard to Google Drive
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          FILE="dashboard/dashboard.json"

          jq -n \
            --arg file "dashboard.json" \
            --arg content "$(cat $FILE)" \
            '{file:$file,content:$content}' \
          | curl -s \
              -X POST \
              -H "Content-Type: application/json" \
              -d @- \
              "$GAS_URL"
