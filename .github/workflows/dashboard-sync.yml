- name: Send dashboard to Google Drive
  env:
    GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
  run: |
    FILE="dashboard.json"

    echo "Checking file..."
    ls -R

    RESPONSE=$(jq -n \
      --arg file "dashboard.json" \
      --arg content "$(cat "$FILE")" \
      '{file:$file,content:$content}' \
      | curl -s \
          -X POST \
          -H "Content-Type: application/json" \
          -d @- \
          "$GAS_URL")

    echo "Apps Script response:"
    echo "$RESPONSE"

    if [ "$RESPONSE" != "OK" ]; then
      echo "Sync failed."
      exit 1
    fi
