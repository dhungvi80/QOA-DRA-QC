
name: Dashboard Sync

on:
  push:
    paths:
      - "dashboard.json"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Verify dashboard file
        run: |
          echo "Current directory:"
          pwd

          echo "Repository contents:"
          ls -la

          test -f dashboard.json

      - name: Send dashboard to Google Drive
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          FILE="dashboard.json"

          RESPONSE=$(jq -n \
            --arg file "$FILE" \
            --arg content "$(cat "$FILE")" \
            '{file:$file,content:$content}' \
            | curl -s \
                -X POST \
                -H "Content-Type: application/json" \
                -d @- \
                "$GAS_URL")

          echo "Apps Script response: $RESPONSE"

          test "$RESPONSE" = "OK"
